<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标由 `node scripts/make-favicon.mjs` 从 public/欢迎页.png 等比缩来，用整张图不裁。
         代价是 16/32px 那两档只剩一团深色轮廓，而且白底方块在深色标签栏上会露出来；
         裁中间那颗球试过了，那球是接近纯黑的实心球，缩完就是个黑点，更糟。
         .ico 里塞了 16~256 六档，Windows 任务栏和老浏览器认它；PNG 给现代浏览器挑。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101117" />
    <!-- 这一行（以及 theme-color / status-bar-style）运行时绝不能用脚本改：iOS 26 一改就放弃沉浸式状态栏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- 状态栏 black-translucent：页面画到状态栏下面（真正全屏），状态栏文字固定白色。
         iOS 26 在这种模式下 100dvh / 100% / position:fixed+inset:0 只到「可视区」（比屏幕矮 62），
         底下会露一截；所以全屏外壳统一用 --app-h（主屏幕 App 里是 100vh），见 index.css。
         登录页（functions/_middleware.js）必须写一样的这几行。改了要删图标重新添加。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uranus" />
    <!-- 页面底色在 JS / CSS 加载前就是深色：iOS 取状态栏、回弹区、启动白屏的颜色都看它。
         这几行和 functions/_middleware.js 里登录页的 <head> 要保持一致（新装图标第一次打开看到的是登录页）。 -->
    <style>html{background:#101117}</style>
    <!-- 标题 Source Serif 4（带 opsz 光学尺寸轴：72px 的 H1 自动拿 display 切割）
         正文 Inter。两个都取 400~600 的可变切片，display=swap + 系统字体兜底，
         字体没下来也不白屏。中文两个都没有字形，会回落系统 CJK。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <title>Uranus · 控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
